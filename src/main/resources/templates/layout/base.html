<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ── Common <head> content ─────────────────────────────── -->
<th:block th:fragment="pageHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.css">
</th:block>

<!-- ── Sidebar ───────────────────────────────────────────── -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
            <i data-feather="bar-chart-2" width="16" height="16" stroke="#7eb0ff"></i>
        </div>
        <div>
            <div class="sidebar-brand-name">My Portfolio</div>
            <div class="sidebar-brand-sub">fund management</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="sidebar-section-label">Navigation</div>
        <a href="/portfolio" class="sidebar-link"
           th:classappend="${requestURI != null and requestURI.startsWith('/portfolio')} ? ' active'">
            <i data-feather="grid"></i> Dashboard
        </a>
        <a href="/investments" class="sidebar-link"
           th:classappend="${requestURI != null and requestURI.startsWith('/investments')} ? ' active'">
            <i data-feather="trending-up"></i> Investments
        </a>
        <a href="/transactions" class="sidebar-link"
           th:classappend="${requestURI != null and requestURI.startsWith('/transactions')} ? ' active'">
            <i data-feather="list"></i> Transactions
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-user-avatar"><i data-feather="user"></i></div>
            <div>
                <div class="sidebar-user-name" sec:authentication="name">User</div>
                <div class="sidebar-user-role">Portfolio Manager</div>
            </div>
        </div>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="sidebar-logout-btn">
                <i data-feather="log-out"></i> Sign Out
            </button>
        </form>
    </div>
</aside>

<!-- ── SSE Toast ─────────────────────────────────────────── -->
<div th:fragment="sseToast" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999">
    <div id="notifToast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <strong id="notifHeader"></strong><br>
                <span id="notifContent"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- ── Common scripts ────────────────────────────────────── -->
<th:block th:fragment="commonScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.js"></script>
    <script src="/js/main.js"></script>
</th:block>

</html>
